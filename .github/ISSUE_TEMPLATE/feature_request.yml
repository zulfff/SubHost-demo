name: Feature request
description: Propose a change or addition.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is not possible today, and who is blocked by it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you propose, and which crates it touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: breaking
    attributes:
      label: Would this break an existing format or API?
      options:
        - "No"
        - "Yes - on-disk format"
        - "Yes - RPC surface"
        - "Yes - CLI surface"
        - "Yes - public Rust API"
    validations:
      required: true
