name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag identity and reviewed ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release/artifacts.py check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.93.0"
      - run: cargo install --locked --version 0.5.10 cargo-cyclonedx
      - name: Build immutable-image binaries and CycloneDX inventory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/build.sh "$RELEASE_TAG" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  publish:
    needs: artifacts
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-artifacts
          path: dist/
      - name: Gate stable v1 on completed S12 review
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          STABLE_APPROVED: ${{ vars.SUBHOST_STABLE_RELEASE_APPROVED }}
        run: |
          python3 scripts/release/artifacts.py allow-publication \
            --tag "$RELEASE_TAG" --stable-approved "$STABLE_APPROVED"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v3.1.4
      - run: python3 scripts/release/artifacts.py verify dist
      - name: Sign and verify artifact checksum manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SUBHOST_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          cosign sign-blob --yes dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json
          bash scripts/release/verify.sh dist "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate image before registry publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: subhost:release-candidate
      - name: Scan candidate before push
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.2
          image-ref: subhost:release-candidate
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose container reference
        id: image
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "ref=ghcr.io/${RELEASE_REPOSITORY,,}:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          provenance: mode=max
          sbom: true
      - name: Scan published immutable image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Sign immutable image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF@$IMAGE_DIGEST"
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
