# cargo-deny configuration: supply-chain and licence gates enforced in CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every entry is a deliberate, reviewed exception with an exit condition. An
# advisory is only listed here when no upgrade exists and the affected code is
# not reachable from a shipped binary.
ignore = [
    # bincode 1.3.3 — development permanently ceased; no upgrade path that keeps
    # the on-disk ledger format byte-stable. This is a maintenance notice, not a
    # vulnerability: no CVE, no known defect. bincode is used only for internal
    # canonical encoding of our own fixed-shape types, never to decode untrusted
    # third-party input (the ledger is checksum- and commitment-verified before
    # it is trusted). Exit: migrate the encoding, which is a ledger format
    # version bump.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; internal encoding only, ledger is separately verified" },

    # The three below all arrive through libp2p -> libp2p-mdns/libp2p-dns ->
    # hickory-*/if-watch. `subhost-network` is the only crate that depends on
    # libp2p, and no binary in this workspace depends on `subhost-network`
    # (verified with `cargo tree -i libp2p`), so none of this code is reachable
    # in a shipped artifact. libp2p 0.56 pins hickory 0.25.2 and cannot take the
    # fixed 0.26.1. Exit: whichever comes first — libp2p relaxing the hickory
    # pin, or a node actually consuming `subhost-network`, at which point these
    # must be resolved before that lands.
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto DNS resolution; unreachable from any binary, pinned by libp2p 0.56" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto DNS encoding; unreachable from any binary, pinned by libp2p 0.56" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc-macro reached only via if-watch under libp2p" },
]

[licenses]
version = 2
# Permissive licences only. Anything copyleft must be reviewed before it is added.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing in this workspace should reach for these.
deny = [
    { crate = "openssl", reason = "use rustls; the workspace must not link system OpenSSL" },
    { crate = "openssl-sys", reason = "use rustls; the workspace must not link system OpenSSL" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
