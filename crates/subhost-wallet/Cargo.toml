[package]
name = "subhost-wallet"
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
description = "Wallet and key management for Subhost Web3"
repository = "https://github.com/subhost-labs/subhost-web3"
rust-version = "1.75"

[dependencies]
subhost-core = { path = "../subhost-core" }
subhost-crypto = { path = "../subhost-crypto" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
scrypt = "0.11"
aes-gcm = "0.10"
rand = { workspace = true }
sha3 = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
