[package]
name = "subhost-cli"
description = "Command line interface for the Subhost Web3 protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "subhost"
path = "src/main.rs"

[[example]]
name = "sync-relay"
path = "examples/sync-relay.rs"
test = true

[dependencies]
subhost-core = { workspace = true }
subhost-consensus = { workspace = true }
subhost-crypto = { workspace = true }
subhost-network = { workspace = true }
subhost-node = { workspace = true }
subhost-rpc = { workspace = true }
subhost-storage = { workspace = true }
subhost-telemetry = { workspace = true, features = ["otlp"] }
subhost-wallet = { workspace = true }
subhost-keystore = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
ark-bls12-381 = { workspace = true }
ark-ff = { workspace = true }
sha3 = { workspace = true }
subhost-wallet = { workspace = true }
tempfile = { workspace = true }
