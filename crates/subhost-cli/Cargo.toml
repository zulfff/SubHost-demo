[package]
name = "subhost-cli"
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
description = "CLI tool for Subhost Web3 protocol"
repository = "https://github.com/subhost-labs/subhost-web3"
rust-version = "1.75"

[[bin]]
name = "subhost"
path = "src/main.rs"

[dependencies]
subhost-core = { path = "../subhost-core" }
subhost-crypto = { path = "../subhost-crypto" }
subhost-wallet = { path = "../subhost-wallet" }
subhost-rpc = { path = "../subhost-rpc" }
clap = { version = "4.4", features = ["derive"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
