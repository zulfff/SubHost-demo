[package]
name = "subhost-faucet"
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
description = "Testnet faucet for Subhost Web3"
repository = "https://github.com/subhost-labs/subhost-web3"
rust-version = "1.75"

[dependencies]
subhost-core = { path = "../subhost-core" }
subhost-wallet = { path = "../subhost-wallet" }
tokio = { workspace = true }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = "5.5"
anyhow = { workspace = true }
blake3 = { workspace = true }
