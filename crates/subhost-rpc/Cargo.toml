[package]
name = "subhost-rpc"
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
description = "subhost-rpc component of Subhost Web3 protocol"
repository = "https://github.com/subhost-labs/subhost-web3"
rust-version = "1.75"

[dependencies]
subhost-core = { path = "../subhost-core" }
subhost-state = { path = "../subhost-state" }
subhost-mempool = { path = "../subhost-mempool" }
subhost-crypto = { path = "../subhost-crypto" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
jsonrpsee = { version = "0.21", features = ["server", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
hex = { workspace = true }
primitive-types = { workspace = true }
bincode = { workspace = true }
ed25519-dalek = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
