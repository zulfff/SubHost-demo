[package]
name = "subhost-network"
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
description = "subhost-network component of Subhost Web3 protocol"
repository = "https://github.com/subhost-labs/subhost-web3"
rust-version = "1.75"

[dependencies]
subhost-core = { path = "../subhost-core" }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
libp2p = { version = "0.53", features = ["tcp", "tls", "dns", "async-std", "noise", "yamux", "websocket", "ping", "kad", "gossipsub", "mdns", "macros"] }

[dev-dependencies]
tokio-test = { workspace = true }
