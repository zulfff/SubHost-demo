[package]
name = "subhost-bench"
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
description = "Benchmark tool for Subhost Web3"
repository = "https://github.com/subhost-labs/subhost-web3"
rust-version = "1.75"

[[bin]]
name = "subhost-bench"
path = "src/main.rs"

[dependencies]
subhost-core = { path = "../subhost-core" }
subhost-crypto = { path = "../subhost-crypto" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hdrhistogram = "7.5"
reqwest = { version = "0.11", features = ["json"] }
futures = { workspace = true }
chrono = "0.4"

[dev-dependencies]
tokio-test = { workspace = true }
