[package]
name = "subhost-bench"
description = "Load and latency benchmark client for a Subhost Web3 RPC endpoint"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "subhost-bench"
path = "src/main.rs"

[dependencies]
subhost-telemetry = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
hdrhistogram = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros"] }
