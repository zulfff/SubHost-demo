[package]
name = "subhost-explorer"
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
description = "Block explorer web UI for Subhost Web3"
repository = "https://github.com/subhost-labs/subhost-web3"
rust-version = "1.75"

[dependencies]
subhost-core = { path = "../subhost-core" }
subhost-rpc = { path = "../subhost-rpc" }
tokio = { workspace = true }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
askama = "0.12"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
