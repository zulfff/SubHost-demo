[package]
name = "subhost-explorer"
description = "Read-only block explorer and demo signing UI for Subhost Web3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "subhost-explorer"
path = "src/main.rs"

[dependencies]
subhost-core = { workspace = true }
subhost-telemetry = { workspace = true }
subhost-wallet = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros"] }
