version: "3.8"

services:
  validator-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subhost-validator-1
    ports:
      - "30333:30333"
      - "8545:8545"
    volumes:
      - validator1-data:/data
    environment:
      - NODE_ROLE=validator
      - CHAIN_ID=1
      - BOOTNODES=
    command: ["subhost", "node", "--validator", "--listen", "0.0.0.0:30333"]
    networks:
      - subhost-net
    restart: unless-stopped

  validator-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subhost-validator-2
    ports:
      - "30334:30333"
      - "8546:8545"
    volumes:
      - validator2-data:/data
    environment:
      - NODE_ROLE=validator
      - CHAIN_ID=1
      - BOOTNODES=/dns4/validator-1/tcp/30333
    command: ["subhost", "node", "--validator", "--listen", "0.0.0.0:30333", "--bootnodes", "/dns4/validator-1/tcp/30333"]
    depends_on:
      - validator-1
    networks:
      - subhost-net
    restart: unless-stopped

  validator-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subhost-validator-3
    ports:
      - "30335:30333"
      - "8547:8545"
    volumes:
      - validator3-data:/data
    environment:
      - NODE_ROLE=validator
      - CHAIN_ID=1
      - BOOTNODES=/dns4/validator-1/tcp/30333
    command: ["subhost", "node", "--validator", "--listen", "0.0.0.0:30333", "--bootnodes", "/dns4/validator-1/tcp/30333"]
    depends_on:
      - validator-1
    networks:
      - subhost-net
    restart: unless-stopped

  validator-4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subhost-validator-4
    ports:
      - "30336:30333"
      - "8548:8545"
    volumes:
      - validator4-data:/data
    environment:
      - NODE_ROLE=validator
      - CHAIN_ID=1
      - BOOTNODES=/dns4/validator-1/tcp/30333
    command: ["subhost", "node", "--validator", "--listen", "0.0.0.0:30333", "--bootnodes", "/dns4/validator-1/tcp/30333"]
    depends_on:
      - validator-1
    networks:
      - subhost-net
    restart: unless-stopped

  rpc-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subhost-rpc
    ports:
      - "8549:8545"
    volumes:
      - rpc-data:/data
    environment:
      - NODE_ROLE=rpc
      - CHAIN_ID=1
      - BOOTNODES=/dns4/validator-1/tcp/30333
    command: ["subhost", "node", "--listen", "0.0.0.0:30333", "--bootnodes", "/dns4/validator-1/tcp/30333"]
    depends_on:
      - validator-1
    networks:
      - subhost-net
    restart: unless-stopped

  faucet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subhost-faucet
    ports:
      - "8090:8080"
    environment:
      - DRIP_AMOUNT=1000000000000000000
      - COOLDOWN_SECS=86400
    command: ["subhost-faucet"]
    depends_on:
      - validator-1
    networks:
      - subhost-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: subhost-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - subhost-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: subhost-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - subhost-net
    restart: unless-stopped

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:
  rpc-data:
  prometheus-data:
  grafana-data:

networks:
  subhost-net:
    driver: bridge
