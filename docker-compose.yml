# Single-node development stack: one node, the explorer, and Prometheus.
#
# This is not a multi-validator network. Block production is single-node
# (see crates/subhost-rpc), so running several `subhost node` services would
# produce independent chains rather than one consensus network.
#
# Every port is published on 127.0.0.1 only. The explorer signs with a local
# wallet and the JSON-RPC surface is unauthenticated, so neither may be exposed
# to a network without an authenticating proxy in front.

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subhost-node
    command:
      - subhost
      - node
      - --listen
      - 0.0.0.0:8545
      - --metrics-addr
      - 0.0.0.0:9090
      - --data-dir
      - /data
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:9090:9090"
    volumes:
      - node-data:/data
    environment:
      RUST_LOG: info
      SUBHOST_LOG_FORMAT: json
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - subhost
        - query
        - chain
        - --rpc-url
        - http://127.0.0.1:8545
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  explorer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subhost-explorer
    command: ["subhost-explorer"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The explorer refuses any non-loopback bind, so it listens inside the
      # container on loopback and is reached through the published port.
      EXPLORER_LISTEN_ADDR: 127.0.0.1:3000
      SUBHOST_RPC_URL: http://node:8545
      SUBHOST_CHAIN_NAME: SubHost
      RUST_LOG: info
    depends_on:
      node:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: subhost-prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      node:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  node-data:
  prometheus-data:
