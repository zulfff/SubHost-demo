<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f172a"/>
  
  <!-- Main S mark - left part (lower triangle) -->
  <path d="M140 320 L140 200 L260 260 L260 380 Z" fill="url(#accentGrad)" filter="url(#softShadow)"/>
  
  <!-- Main S mark - right part (upper triangle) -->
  <path d="M252 192 L372 132 L372 252 L252 312 Z" fill="url(#mainGrad)" filter="url(#softShadow)"/>
  
  <!-- Connection point/dot -->
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
  
  <!-- Subtle grid lines in background -->
  <line x1="60" y1="256" x2="100" y2="256" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <line x1="412" y1="256" x2="452" y2="256" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <line x1="256" y1="60" x2="256" y2="100" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <line x1="256" y1="412" x2="256" y2="452" stroke="#334155" stroke-width="1" opacity="0.5"/>
</svg>
