[workspace]
members = [
    "crates/subhost-core",
    "crates/subhost-crypto",
    "crates/subhost-consensus",
    "crates/subhost-network",
    "crates/subhost-state",
    "crates/subhost-storage",
    "crates/subhost-ibc",
    "crates/subhost-node",
    "crates/subhost-rpc",
    "crates/subhost-mempool",
    "crates/subhost-metrics",
    "crates/subhost-telemetry",
    "crates/subhost-cli",
    "crates/subhost-wallet",
    "crates/subhost-faucet",
    "crates/subhost-bench",
    "explorer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
repository = "https://github.com/zulfff/SubHost-demo"
# Raised from 1.75: transitive dependencies in Cargo.lock require edition 2024,
# which 1.75 cannot parse. 1.89 specifically is the floor because
# enum-ordinalize 4.4.2, reached through educe -> ark-ec, declares
# rust-version = 1.89. CI verifies this exact version.
rust-version = "1.89"

# Internal crates are declared centrally so a version/path change is a one-line edit.
[workspace.dependencies]
subhost-core = { path = "crates/subhost-core", version = "0.1.0" }
subhost-crypto = { path = "crates/subhost-crypto", version = "0.1.0" }
subhost-consensus = { path = "crates/subhost-consensus", version = "0.1.0" }
subhost-network = { path = "crates/subhost-network", version = "0.1.0" }
subhost-state = { path = "crates/subhost-state", version = "0.1.0" }
subhost-storage = { path = "crates/subhost-storage", version = "0.1.0" }
subhost-ibc = { path = "crates/subhost-ibc", version = "0.1.0" }
subhost-node = { path = "crates/subhost-node", version = "0.1.0" }
subhost-rpc = { path = "crates/subhost-rpc", version = "0.1.0" }
subhost-mempool = { path = "crates/subhost-mempool", version = "0.1.0" }
subhost-metrics = { path = "crates/subhost-metrics", version = "0.1.0" }
subhost-telemetry = { path = "crates/subhost-telemetry", version = "0.1.0" }
subhost-wallet = { path = "crates/subhost-wallet", version = "0.1.0" }

# Runtime / async
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Errors and diagnostics
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Cryptography
ark-bls12-381 = "0.6"
ark-ec = "0.6"
ark-ff = "0.6"
ark-serialize = "0.6"
sha3 = "0.10"
blake3 = "1.5"
rand = "0.8"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "3.0"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
scrypt = "0.11"
aes-gcm = "0.11"

# Networking / services
# tokio transport, not async-std: the whole application is tokio-based, and
# async-std is discontinued (RUSTSEC-2025-0052).
libp2p = { version = "0.56", features = ["tcp", "dns", "tokio", "noise", "yamux", "ping", "kad", "gossipsub", "mdns", "macros"] }
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prometheus = { version = "0.13", default-features = false }

# Utilities
clap = { version = "4.4", features = ["derive"] }
dashmap = "5.5"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hdrhistogram = "7.5"
tempfile = "3.9"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = false
lto = "fat"
