[workspace]
members = [
    "crates/subhost-core",
    "crates/subhost-crypto",
    "crates/subhost-consensus",
    "crates/subhost-network",
    "crates/subhost-evm",
    "crates/subhost-state",
    "crates/subhost-zk",
    "crates/subhost-governance",
    "crates/subhost-ibc",
    "crates/subhost-node",
    "crates/subhost-rpc",
    "crates/subhost-mempool",
    "crates/subhost-storage",
    "crates/subhost-metrics",
    "crates/subhost-p2p",
    "crates/subhost-types",
    "crates/subhost-utils",
    "crates/subhost-wasm",
    "crates/subhost-telemetry",
    "crates/subhost-cli",
    "crates/subhost-wallet",
    "crates/subhost-faucet",
    "crates/subhost-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Subhost Labs <dev@subhost.io>"]
license = "Apache-2.0"
repository = "https://github.com/subhost-labs/subhost-web3"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
sha3 = "0.10"
blake3 = "1.5"
rand = "0.8"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "3.0"
zeroize = "1.7"
libp2p = { version = "0.55", features = ["tcp", "tls", "dns", "noise", "yamux"] }
quinn = "0.10"
rustls = { version = "0.21", features = ["quic"] }
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
redb = "1.5"
parking_lot = "0.12"
revm = { version = "3.5", features = ["std", "serde"] }
alloy-primitives = { version = "0.6", features = ["serde", "k256"] }
alloy-sol-types = { version = "0.6", features = ["json"] }
wasmtime = "16.0"
wasmer = "4.2"
tokio-test = "0.4"
proptest = "1.4"
criterion = "0.5"
bincode = "1.3"
hex = "0.4"
tempfile = "3.9"
futures = "0.3"
async-trait = "0.1"
dashmap = "5.5"
rayon = "1.8"
num_cpus = "1.16"
primitive-types = "0.12"
ethereum-types = "0.14"
fixed-hash = "0.8"
uint = "0.9"

clap = "4.4"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "limit"] }
jsonrpsee = { version = "0.21", features = ["server", "macros"] }
scrypt = "0.11"
aes-gcm = "0.10"
hdrhistogram = "7.5"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = false
lto = "fat"
